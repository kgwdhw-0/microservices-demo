name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: adservice,             context: src/adservice }
          - { service: cartservice,           context: src/cartservice/src }
          - { service: checkoutservice,       context: src/checkoutservice }
          - { service: currencyservice,       context: src/currencyservice }
          - { service: emailservice,          context: src/emailservice }
          - { service: frontend,              context: src/frontend }
          - { service: loadgenerator,         context: src/loadgenerator }
          - { service: paymentservice,        context: src/paymentservice }
          - { service: productcatalogservice, context: src/productcatalogservice }
          - { service: recommendationservice, context: src/recommendationservice }
          - { service: shippingservice,       context: src/shippingservice }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/kgwdhw-0/${{ matrix.service }}:latest
            ghcr.io/kgwdhw-0/${{ matrix.service }}:${{ github.sha }}